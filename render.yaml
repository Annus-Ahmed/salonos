services:
  - type: web
    name: salonos
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --import tsx scripts/initialize-render.ts && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
